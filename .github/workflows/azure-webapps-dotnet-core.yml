name: Deploy to Production

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
  workflow_dispatch: 

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:    
    if: github.event.workflow_run.conclusion == 'success'  #  GitHub automatically populates the event payload with information about the workflow that caused the trigger.

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: drop
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: pul-yaml-64868481
          package: artifact/webapp.zip
